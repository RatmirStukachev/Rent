<div class="col">
    <div class="perf-product-card d-flex flex-column">
        {% if product.is_new %}
            <div class="perf-badge new">NEW</div>
        {% endif %}
        {% if product.is_hit %}
            <div class="perf-badge hit">ХИТ</div>
        {% endif %}

        <div class="perf-product-img-wrapper">
            <a href="{% url 'catalog:product_detail' product.id product.slug %}">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid">
                {% else %}
                    <div class="d-flex align-items-center justify-content-center text-muted" style="height: 180px; background:#f1f1f1;">Нет фото</div>
                {% endif %}
            </a>
        </div>

        <div class="p-3 d-flex flex-column flex-grow-1">
            <div class="mb-2 text-center">
                {% if product.status == 'available' %}
                    <span class="small text-success fw-bold">В наличии</span>
                {% else %}
                    <span class="small text-danger fw-bold">Занято</span>
                {% endif %}
            </div>
            <a href="{% url 'catalog:product_detail' product.id product.slug %}" class="perf-product-title text-center">{{ product.name }}</a>
            <div class="mt-auto text-center pt-2">
                <div class="perf-product-price mb-3">{{ product.price_per_day }} BYN</div>
                <a href="{% url 'catalog:product_detail' product.id product.slug %}" class="btn-perf w-100 d-block text-center">В корзину</a>
            </div>
        </div>
    </div>
</div>
